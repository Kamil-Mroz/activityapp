{% extends "base.html" %}


{% block title %}

{% endblock title %}

{% block content %}

<section class="grow grid place-items-center">
  <div class="space-y-10 flex flex-col items-center w-full">
    <h1 class="text-3xl">Create a new exercise</h1>
    <div class="max-w-sm w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-600 ">
      <div class="p-4 sm:p-8">
        <form method="POST" enctype="multipart/form-data" class="dark:text-white text-black space-y-4">
          {%csrf_token%}
          

            {{form.as_p}}
          
          
          <button type="submit" class="focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5 mx-auto block dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">Create</button>
          
        </form>
      </div>
    </div>
  </div>
</section>

{% endblock content %}
