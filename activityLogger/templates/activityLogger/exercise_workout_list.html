{% extends "base.html" %}
{% block content %}
<section class="grow space-y-7 flex flex-col items-center">
  
  <h2 class="text-2xl">Select workout</h2>
  <div class="w-full h-1 grow max-w-sm overflow-y-auto space-y-3">
    {% for workout in workouts %}
    <a href="{% url 'exercise_add_workout' exercise_id workout.id %}" class="text-gray-900 hover:text-white border border-gray-800 hover:bg-gray-900 focus:ring-4 focus:outline-none focus:ring-gray-300 font-medium rounded-lg text-sm px-5 py-2.5  dark:border-gray-600 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-800 block">
      <span class="block ">{{workout.title}}</span>
      <span>{{ workout.exercise_string|slice:"0:60" }}{% if workout.exercise_string|length > 60 %}...{% endif %}</span>
    </a>
    {% endfor %}
  </div>

  
    
  

</section>
{% endblock content %}
