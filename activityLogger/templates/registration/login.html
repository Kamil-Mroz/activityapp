{% extends "base.html" %}
{% load static %}
{% block header %}
    <link rel="stylesheet" href="{% static 'css/index.css'%}">
{% endblock header %}
{% block content %}
<section class="grid flex-1 place-items-center">
            <div class="w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800 dark:border-gray-600">
                <div class="p-4 space-y-4 md:space-y-6 sm:p-8">
                    <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl dark:text-white">
                        Login to your account
                </h1>
                <form class="space-y-4 md:space-y-6 login-form" method="POST">
                {% csrf_token %}
                    {{form.as_p}}
                    
                        
                    <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Sign in</button>
                    <div class="text-sm font-light text-gray-500 dark:text-gray-400">
                        Don’t have an account yet? <a href="{% url 'register' %}" class="font-medium text-blue-600 hover:underline dark:text-blue-500">Register</a>
                    </div>
                </form>
                </div>
            </div>
    </section>

{% endblock content %}
